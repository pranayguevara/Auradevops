name: Basic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Build the files
        run: |
          mkdir -p app/src/
          cd app/src/
          echo "This is a basic file" > buildfile.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-app1
          path: app/src/
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images-app1
          path: dist/
      - name: testing the artifact
        run: |
          echo "Testing the file exists or not"
          if [[ -f "dist/buildfile.txt" ]]; then
              echo "File artifact is there"
          else
              echo "File not there"
              exit 1
          fi
