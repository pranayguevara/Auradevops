name: Full CI Pipeline (Practice)

# Lesson 2: trigger on both push to main AND pull requests targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ---------------------------------------------------------
  # JOB 1: BUILD
  # ---------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: echo "Pretending to install dependencies..."

      - name: Lint
        run: echo "Lint passed ✅"

      - name: Create build output
        run: |
          mkdir -p dist
          echo "This is a fake build output" > dist/app-build.txt
          echo "Version: 1.0.${{ github.run_number }}" >> dist/app-build.txt

      # Lesson 3: upload the build output so other jobs can use it
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7   # override the 90-day default

  # ---------------------------------------------------------
  # JOB 2: TEST
  # runs only after 'build' finishes (needs:), on its own fresh VM
  # ---------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: build
    env:
      APP_ENV: staging                                # plain env var
      SECRET_VALUE: ${{ secrets.MY_TEST_SECRET }}      # Lesson 4: masked in logs automatically
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Lesson 3: pull down what 'build' produced (jobs don't share files by default)
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/

      - name: Verify build output exists
        run: |
          cat dist/app-build.txt
          if [ -f "dist/app-build.txt" ]; then
            echo "Build artifact found ✅"
          else
            echo "Build artifact missing ❌"
            exit 1
          fi

      - name: Run check script
        run: |
          chmod +x check_script.sh
          ./check_script.sh

      - name: Show env var (safe)
        run: echo "Running in $APP_ENV environment"

      - name: Try to print the secret (should show ***)
        run: echo "Secret is: $SECRET_VALUE"

  # ---------------------------------------------------------
  # JOB 3: DEPLOY
  # runs after test passes, proves AWS auth works end-to-end
  # ---------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/
      - name: Configure AWS credentials
        run : |
          echo "Pretending to configure AWS credentials..."
          echo "And deploying the build artifact..."